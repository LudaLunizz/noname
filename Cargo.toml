[package]
name = "noname"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Silvertree2010/noname"

[dependencies]
ratatui = "0.29"
unicode-width = "0.2"
serde_json = "1"
vt100 = "0.15"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_Security", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
